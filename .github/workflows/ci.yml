name: SINAIT CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  flutter-analyze:
    name: Flutter analyze y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: Instalar dependencias
        working-directory: app
        run: flutter pub get
      - name: Analizar código
        working-directory: app
        run: flutter analyze
      - name: Correr tests
        working-directory: app
        run: flutter test

  node-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci