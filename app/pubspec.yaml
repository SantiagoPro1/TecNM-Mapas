name: sinait
description: Sistema de Navegación Inteligente Accesible del Instituto Tecnológico
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  flutter_tts: ^4.0.2
  speech_to_text: ^7.3.0

  google_mlkit_image_labeling: ^0.11.0
  tflite_flutter: ^0.10.4
  camera: ^0.10.5+9

  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  go_router: ^13.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  flutter_animate: ^4.5.0
  permission_handler: ^11.3.0

  flutter_riverpod: ^2.5.1

  dio: ^5.4.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  intl: ^0.19.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/
    - assets/models/