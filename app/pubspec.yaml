name: navia
description: Sistema de Navegación Inteligente Accesible del Instituto Tecnológico
version: 1.0.4+6
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  flutter_tts: ^4.0.2

  image: ^4.0.0

  qr_flutter: ^4.1.0

  go_router: ^13.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  flutter_animate: ^4.5.0
  permission_handler: ^12.0.1

  flutter_riverpod: ^2.5.1

  dio: ^5.4.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  intl: ^0.19.0
  logger: ^2.3.0
  flip_card: ^0.7.0
  barcode_widget: ^2.0.4

  # Mapas y Geolocalización (Google Maps)
  google_maps_flutter: ^2.9.0
  geolocator: ^11.0.0
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.4
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Iconos SVG vectoriales para marcadores del mapa
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  http: ^1.6.0
  image_picker: ^1.2.2
  crypto: ^3.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - .env                              # Variables de entorno (flutter_dotenv)
    - assets/images/
    - assets/maps/
    - assets/maps/tec_colima_map.json
    - assets/maps/sendera_map.json
    - assets/maps/zentralia_map.json
    - assets/icons/svg/                  # Iconos SVG para marcadores del mapa
    - assets/categories/                 # Ilustraciones por tipo de lugar
    - assets/places/                     # Fotos propias de cada punto del mapa
    - assets/map_styles/
    - assets/map_styles/dark_style.json
    - assets/map_styles/light_style.json

  fonts:
    # Fuente empaquetada localmente (no via red) a propósito: la app está
    # pensada para funcionar sin señal, así que la tipografía no puede
    # depender de descargarse la primera vez que se abre.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
